
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: r28b
          api-level: 36
          build-tools-version: 36.0.0

      - name: Build Debug APK
        run: |
          cd anm2ed-3.0/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anm2ed-debug
          path: anm2ed-3.0/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
